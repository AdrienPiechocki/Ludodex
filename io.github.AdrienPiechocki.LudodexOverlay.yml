id: io.github.AdrienPiechocki.LudodexOverlay
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: ludodex-overlay
finish-args:
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  # Drapeau « souris libérée » lu par le hook LD_PRELOAD des jeux (hôte).
  - --filesystem=~/.local/share/ludodex-hook:create
modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts: [-Dintrospection=true, -Dexamples=false]
    sources:
      - type: archive
        url: https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz
        sha256: 1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192
  - name: ludodex-hook
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -O2 -o libludodex-hook.so hook.c -ldl -lpthread
      - install -Dm755 libludodex-hook.so /app/lib/libludodex-hook.so
    sources:
      - type: file
        path: ludodex-overlay/hook/hook.c
  - name: ludodex-overlay
    buildsystem: simple
    build-commands:
      - install -d /app/share/ludodex-overlay
      - cp -a ludodex_overlay /app/share/ludodex-overlay/
      - install -Dm755 ludodex-overlay /app/bin/ludodex-overlay
    sources:
      - type: dir
        path: ludodex-overlay
        skip: [.flatpak-builder, __pycache__, tests]
      - type: dir
        path: flatpak
        only-include: [ludodex-overlay]
