# Minecraft Vanilla achievements (in English, based on the chat announcements) for Ludodex.
#
# Format of the lines read from the log:
#   System chat: <Player> has completed the challenge [<Achievement Name>]
#   System chat: <Player> has completed the advancement [<Achievement Name>]
#
# Notes:
# - Achievement names match the official English titles of Minecraft Java Edition.
# - hidden: true masks secret or end-game achievements.

achievements:

  # ======================================================================
  # STORY
  # ======================================================================
  - name: "Stone Age"
    description: "Mine stone with your new pickaxe."
    icon: "⛏️"
    match: '\[Stone Age\]'
    case_insensitive: true

  - name: "Getting an Upgrade"
    description: "Construct a better pickaxe."
    icon: "🪨"
    match: '\[Getting an Upgrade\]'
    case_insensitive: true

  - name: "A Seedy Place"
    description: "Plant a seed and watch it grow."
    icon: "🌱"
    match: '\[A Seedy Place\]'
    case_insensitive: true

  - name: "Hot Stuff"
