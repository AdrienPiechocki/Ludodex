# Succès Morrowind + extensions + Tamriel Rebuilt pour Ludodex (module « Achievements »).
#
# À utiliser avec le mod OpenMW « Ludodex Logger » (LudodexLogger.zip) : le tracker lit
# openmw.log. Chaque motif est une expression régulière en recherche libre, appliquée
# ligne par ligne. Format des lignes produites par le mod :
#   QUEST STARTED: <id>            QUEST UPDATE: <id> | stage=N      QUEST COMPLETE: <id>
#   NPC KILLED: <nom> | id=...     CREATURE KILLED: <nom> | id=...   ENEMY ENCOUNTER: <nom> | id=...
#   LEVEL UP: N                    SKILL UP: <skill> | level=N       ATTRIBUTE UP: <attr> | value=N
#   ITEM ACQUIRED: <nom> | xN | id=...                              SPELL LEARNED: <nom> | id=...
#   FACTION JOINED: <nom> | id=<faction>   FACTION RANK: <nom> | rank=N | title=...
#   LOCATION / REGION / INTERIOR DISCOVERED: <nom>                  CELL ENTERED: <nom> | exterior|interior
#   NPC TALKED / BARTER OPENED / TRAINING OPENED / TRAVEL SERVICE OPENED: <nom>
#   BOOK READ / SCROLL READ: <nom>   BOUNTY INCREASED|DECREASED: N   PLAYER DIED: Player   REST: started
#
# Notes :
# - OpenMW met les ids de quêtes en minuscules : tous les succès sont en case_insensitive.
# - Les stages « QUEST UPDATE » sont des correspondances exactes (stage=N) ou « >= N » (regex numérique).
# - Les noms de lieux (villes, tombeaux...) sont ceux des cellules : motif en sous-chaîne, donc tolérant.
# - Les préfixes d'ids Tamriel Rebuilt suivent la convention TR_m<carte>_<initiales>_<nom> :
#   FG, MT, TT, IL confirmés ; MG, TG, HH, HT déduits de la convention, à vérifier dans ton log.
# - Les motifs avec « . » à la place d'une apostrophe évitent les soucis de guillemets.
# - Project Tamriel (Project Cyrodiil, Skyrim: Home of the Nords) : le guide d'ids de PT impose les préfixes PC_ et Sky_ ;
#   les quêtes sont donc comptées avec pc_ et (sky|shotn)_ (à vérifier dans ton log). Les factions PT sont reconnues par
#   leur id Tamriel_Data (t_cyr_..., t_sky_...). Les promotions utilisent « FACTION RANK: ... id=... » (mod mis à jour).
# - hidden: true marque les succès dont le nom ou la description révèle une quête, une intrigue, un objet ou un secret.
# - Poison Song (TR 26.08) : les ids des nouvelles quêtes ne sont pas publics, donc les succès reposent sur
#   les lieux (CELL ENTERED), les factions (Indoril, Ordinators) et les titres de rang. Les titres de rang
#   Indoril (Oathman, Kinsman, Concordant Minister, Illuminated Elder) viennent de l'UESP et peuvent différer
#   du jeu ; le préfixe tr_m<n>_hi_ (House Indoril) est déduit de la convention d'ids de TR.

