# Fear & Hunger achievements for Ludodex
# Log: ludodex.log, written by the LudodexLogger.js plugin (game folder, next to index.html)
#
# None of the generic achievements below depend on any game identifier or
# text: they work the same on the original English game and on any
# translated patch. The plugin only logs database IDs, never text.
# The story achievements (bosses, endings, key items...) match on database
# IDs taken from YOUR installation's ludodex-dump.txt: IDs may differ between
# the original game and a translation patch.

achievements:

