  # --------------------------------------------------------- Add Your Own
  # Look up the ID in ludodex-dump.txt (categories: enemy, troop, actor, item,
  # weapon, armor, map, switch, variable, commonevent), then:
  # - battle  : 'BATTLE FIRST WON: troop=<ID> '   (trailing space required)
  # - recruit : 'PARTY JOIN: actor=<ID> '
  # - item    : 'ITEM ACQUIRED: item=<ID> '  / weapon= / armor=
  # - story   : 'SWITCH ON: switch=<ID> '
  # - place   : 'LOCATION DISCOVERED: map=<ID> '
