  # --------------------------------------------------------------- Story
  # Endings, bosses, recruits, key items and story beats, using the IDs of
  # YOUR installation (see ludodex-dump.txt; IDs may differ between the
  # original game and a translation patch). Ending achievements are hidden
  # (spoilers).
  #
  # The plugin writes an ENDING line when the credits roll (common event 310):
  #   ENDING: map=86 ending=e last_troop=0 throne=0 girl=0 legarde=0 leader=1 | <map>
  # - ending=   : ending recognized from the final battle's troop, then the map
  # - throne=1  : the player sat on the Throne of Ascension
  # - girl/legarde=1 : that character was in the party at the credits
  # Endings C-II, D and S are deduced from these fields (regex below).
  # If an ending produces no ENDING line, check ludodex.log for which common
  # event marks the credits and adjust the creditsEventIds parameter.

  # ---------------------------------------------------------------- Endings
  - name: The God of Fear & Hunger
    description: Reach ending A, taking the Girl to the Heart of Darkness.
    icon: '👶'
    match: 'ending=a'
    hidden: true

  - name: The Older One
    description: Reach ending B, at the Heart of Darkness without the Girl.
    icon: '🌑'
    match: 'ending=b'
    hidden: true

  - name: The Yellow King
    description: Reach ending C, rejecting Le'garde in the Void.
    icon: '👑'
    match: 'ending=c'
    hidden: true

  - name: The Prophecy
    description: Reach ending C-II, kneeling before Le'garde in the Void.
    icon: '🙇'
    match: 'ENDING: .* ending=none .*throne=1 .*legarde=1 '
    hidden: true

  - name: A New God
    description: Reach ending D, taking the Throne of Ascension.
    icon: '🔱'
    match: 'ending=d'
    hidden: true

  - name: Escape?
    description: Reach ending E, leaving the dungeons after finding Le'garde.
    icon: '🚪'
    match: 'ending=e'
    hidden: true

  - name: The Happy Ending
    description: 'Cahara''s S ending: place the King''s Crown on your head.'
    icon: '☀️'
    match: 'ITEM ACQUIRED: item=189 '
    hidden: true

  - name: The True God of Fear and Hunger
    description: 'D''arce''s S ending: cast Rebirth of the Beloved on Le''garde.'
    icon: '🖤'
    match: 'SKILL USED: actor=3 skill=290 '
    hidden: true

  - name: The Enlightenment
    description: 'Enki''s S ending: claim the Soul Anchor.'
    icon: '💡'
    match: 'ITEM ACQUIRED: armor=53 '
    hidden: true

  - name: The God of Ultra-Violence
    description: 'Ragnvaldr''s S ending: gather every soul and ascend the Throne.'
    icon: '🔪'
    match: 'ENDING: .* ending=none .*throne=1 .*legarde=0 .*leader=5 '
    hidden: true

  - name: Every Ending
    description: Discover all 10 endings of the game.
    icon: '🏆'
    all:
      - 'ending=a'
      - 'ending=b'
      - 'ending=c'
      - 'ending=none .*throne=1 .*legarde=1 '
      - 'ending=d'
      - 'ending=e'
      - 'ITEM ACQUIRED: item=189 '
      - 'SKILL USED: actor=3 skill=290 '
      - 'ITEM ACQUIRED: armor=53 '
      - 'ending=none .*throne=1 .*legarde=0 .*leader=5 '
    hidden: true

