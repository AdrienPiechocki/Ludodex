# Vintage Story achievements for Ludodex ("Achievements" module).
#
# To use with the "LudodexLogger" Vintage Story mod (server-side C# mod, works in single player).
# The mod appends one line per state change to ludodex.log
# (default: <VintagestoryData>/Logs/ludodex.log, configurable in ModConfig/ludodexlogger.json).
# Each pattern is a free-search regular expression, applied line by line.
# Format of the lines produced by the mod ("<code>" is the game code without the "game:" domain,
# e.g. ingot-copper, ore-poor-nativecopper-granite, drifter-normal):
#   ITEM ACQUIRED: <code> | n=<distinct items seen>     first time an item/block code shows up in
#                                                        hotbar, backpack or clothing slots
#   ITEMS DISCOVERED: n=<10|25|50|100|200|300|500>      milestone of distinct item codes
#   BLOCK BROKEN: <code>                                 first time a block code is broken
#   BLOCK PLACED: <code>                                 first time a block code is placed
#   BLOCK USED: <code>                                   first time a block code is right-clicked
#   BLOCKS BROKEN: n=<1|10|100|500|1000|2500|5000|10000|25000|50000|100000>
#   BLOCKS PLACED: n=<same milestones>
#   ENTITY KILLED: <code> | n=<total kills>             every creature killed by the player
#   PLAYER DIED: x1 | cause=<EnumDamageType> | by=<entity code, optional>
#   CLASS SELECTED: <characterClass>
#   DISTANCE TRAVELED: km=<1|5|10|25|50|100|250|500|1000>
#   DEPTH REACHED: m=<25|50|75|100>                      metres below sea level
#   ALTITUDE REACHED: m=<25|50|75|100|125>               metres above sea level
#   TEMPORAL STABILITY: below=<75|50|25|10|1>            percent, first time the player drops under it
#   WORLD DAY: n=<1|10|30|60|100|200|365|500|1000>       in-game days elapsed in the world
#   LUDODEX LOGGER READY: hooked=<n> | missing=<hooks that failed to register>
#
# Notes:
# - Only the first occurrence of each item / block code emits a line (transitions only), so the
#   log stays small. State is stored in the savegame; run "/ludodex" in chat after deleting or
#   moving the log to truncate it and re-emit everything.
# - Creative / spectator players are ignored by default (config "OnlySurvival").
# - Provisional: the line formats are implemented but not seen in a real session yet. The item,
#   block and entity codes in the patterns below come from the base game as far as known, but
#   they are intentionally loose (prefix / alternation matches) and some may need a tweak after
#   the first real playthrough: every code the player meets is written to the log, so a wrong
#   pattern is fixed by looking up the real code in ludodex.log. Families to double-check:
#   firepit / pitkiln, ores, bronze alloys, mechanical power blocks, crops, translocators,
#   the rare drifter variants and the damage "cause" names.
# - count: N counts matching lines (used for kills and deaths).
# - hidden: true marks achievements whose name or description would spoil something.

achievements:

  # ======================================================================
  # FIRST STEPS
  # ======================================================================

  - name: "Scavenger"
    description: "Discover 25 different items."
    icon: "🎒"
    match: 'ITEMS DISCOVERED: n=25\b'
    case_insensitive: true

  - name: "Collector"
    description: "Discover 100 different items."
    icon: "🧺"
    match: 'ITEMS DISCOVERED: n=100\b'
    case_insensitive: true

  - name: "Curator"
