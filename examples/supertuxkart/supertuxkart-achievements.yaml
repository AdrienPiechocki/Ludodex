  - name: "Story Complete"
    description: "Finish the story mode."
    icon: "📖"
    match: '\sfinished="true"'
    hidden: true

  - name: "Speedrunner"
    description: "Finish the story mode in speedrun mode."
    icon: "⏱️"
    match: 'speedrun-finished="true"'
    hidden: true
