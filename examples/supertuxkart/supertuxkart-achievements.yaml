  # ======================================================================
  # STORY MODE
  # ======================================================================

  - name: "First Trophy"
    description: "Complete a story-mode challenge."
    icon: "🏅"
    match: 'solved="(easy|medium|hard|best)"'

  - name: "Gold Cup"
    description: "Complete a challenge at gold rank or better."
    icon: "🥇"
    match: 'solved="(hard|best)"'

  - name: "Platinum"
    description: "Complete a challenge at the best rank."
    icon: "💎"
    match: 'solved="best"'

  - name: "Grand Prix 1"
    description: "Complete story-mode Grand Prix 1."
    icon: "🏎️"
    match: '<gp1 solved="(easy|medium|hard|best)"'

  - name: "Grand Prix 2"
