  - name: "SuperTux"
    description: "Unlock SuperTux."
    icon: "🐧"
    match: '<unlock_supertux solved="(easy|medium|hard|best)"'

  - name: "First Bonus Kart"
    description: "Unlock the first bonus kart."
    icon: "🛻"
    match: '<unlock_bonus_kart1 solved="(easy|medium|hard|best)"'

  - name: "Second Bonus Kart"
    description: "Unlock the second bonus kart."
    icon: "🚙"
