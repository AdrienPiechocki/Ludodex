# Voices of the Void achievements for Ludodex ("Achievements" module).
#
# Meant for the "Ludodex Logger" UE4SS mod (LudodexLogger/Scripts/main.lua). Log lines are written to UE4SS.log
# and appended to %LOCALAPPDATA%\VotV\ludodex.log (under Proton: inside the game's Wine prefix). Line formats:
#   WORLD LOADED: x1                          DAY REACHED: N                       POINTS MILESTONE: N
#   GAME ACHIEVEMENT: <args> | fn=<Class>:<function>      GAME ADVANCEMENT: <args> | fn=<Class>:<function>
#   ACTOR SPAWNED: <BlueprintClass_C>         LUDODEX LOGGER LOADED / READY: hooks=N | functions=N
#
# Calibrated against the game's own list_achievements DataTable (88 internal ids) and the real
# addAchievementPopup call (Data struct: name, displayName, desc, progress, progressTarget, award).
# Achievement lines look like:
#   GAME ACHIEVEMENT: <id> | <displayName> | progress=x/y | type=n | fn=mainGamemode_C:addAchievementPopup
# Partial progress is logged as "GAME ACHIEVEMENT PROGRESS:" and never matches here. Mirror achievements match
# the internal id (primary) or the English displayName (fallback); keep the game in English for the fallback.
# DAY REACHED / POINTS MILESTONE come from saveSlot.Day and saveSlot.Points (polled every 5 s).
# Encounter achievements still match fragments of Blueprint class names and need TRACK_SPAWNS = true.
#
# All matching is case-insensitive. hidden: true marks spoiler-heavy achievements (secrets, endings, rituals).
# Sources for the in-game list: the Voices of the Void wiki (Guides/Achievements).

