# Mindustry achievements for Ludodex ("Achievements" module).
#
# To use with the "Ludodex Logger" mod for Mindustry (LudodexLogger.zip, a script mod: scripts/main.js).
# The mod writes each event as one line, both to the game log (last_log.txt in the Mindustry data folder)
# and to <data folder>/ludodex.log (appended across sessions). Each pattern is a free-search regular expression,
# applied line by line. Format of the lines produced by the mod:
#   GAME STARTED: <map> | mode=<mode> | campaign=true|false | sector=<id> | planet=<planet>
#   SECTOR ENTERED / SECTOR CAPTURED / SECTOR LOST / SECTOR LAUNCH: <sector id> | name=... | planet=... [| initial=true|false]
#   WAVE REACHED: N | mode=... | sector=... | planet=...       GAME OVER: victory|defeat | sector=... | wave=N | ...
#   GAME SAVED / GAME LOADED: <map>                              ITEM LAUNCHED: <item> | amount=N
#   RESEARCH COMPLETE: <content> | type=block|unit|item|sector|...    RESOURCE UNLOCKED: <item|liquid> | type=...
#   BLOCK BUILT: <block> | by=player|builder      BLOCK DECONSTRUCTED: x1      BLOCK DESTROYED: <block> | team=... | ours=true|false
#   CORE DESTROYED: <core> | team=... | ours=true|false
#   UNIT PRODUCED: <unit> | factory=<block>      ENEMY DESTROYED: <unit> | team=... | boss=true|false | flying=true|false
#   UNIT LOST: <unit>      UNIT DROWNED: <unit> | ours=true|false      PLAYER DIED: <unit>      PLAYER UNIT: <unit>
#   ITEM MILESTONE: <item> | amount=N      (N in 100, 1000, 4000, 9000, 13000; never logged with infinite resources)
#   SCHEMATIC CREATED: x1   MULTIPLAYER HOSTED / MULTIPLAYER JOINED: x1   PLAYER JOINED: <name>
#   GAME TRIGGER: thoriumReactorOverheat | impactPower | forceProjectorBreak | acceleratorUse | tutorialComplete
#   LUDODEX LOGGER READY: hooked=N | missing=<events absent from your game version, or "none">
#
# Notes:
# - All names are Mindustry internal names (lowercase, hyphenated for blocks/units/items: silicon-smelter,
#   phase-fabric; camelCase for Serpulo sector presets: groundZero, frozenForest...). Every achievement is case_insensitive.
# - Matching a block/unit name is exact: patterns end with " \|", so "conveyor" does not match "titanium-conveyor".
# - count: N counts matching lines. Counters are cumulative only if the tracker reads ludodex.log
#   (last_log.txt is rewritten at every game launch).
# - Numeric thresholds (wave >= 30, ...) use regexes matching any integer >= the threshold.
# - Erekir sector ids (onset, aegis, origin) and Erekir block ids (beam-node, plasma-bore, cliff-crusher,
#   core-bastion...) are written from the game's source; if one never unlocks, check the exact id in the log
#   (grep "SECTOR CAPTURED" / "BLOCK BUILT") and adjust the pattern.
# - hidden: true marks achievements whose name or description reveals a secret or an endgame sector.
# - Capture/win events fire on the local game: in multiplayer, "BLOCK BUILT" counts every block built by your team.

