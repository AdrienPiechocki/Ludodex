# Pseudoregalia achievements for Ludodex ("Achievements" module).
#
# To use with the "LudodexLogger" UE4SS mod for Pseudoregalia (LudodexLogger-Pseudoregalia.zip,
# Mods/LudodexLogger/Scripts/main.lua). The mod appends one line per state change to ludodex.log
# (next to UE4SS.log, in pseudoregalia/Binaries/Win64/). Each pattern is a free-search regular
# expression, applied line by line. Format of the lines produced by the mod:
#   UPGRADE ACQUIRED: <id>              powerup flags on the pawn (obtained*? lowercased):
#                                        attack, slide, map, airkick, powerboost, plunge,
#                                        chargeattack, wallride, light, projectile, slidejump;
#                                        also polled, but granted by no pickup: guard, jump, sprint
#   ZONE ENTERED: <map>                 map package names: ZONE_Dungeon, ZONE_LowerCastle,
#                                        Zone_Upper, Zone_Library, Zone_Theatre, ZONE_Exterior,
#                                        Zone_Caves, Zone_Tower, Zone_PrincessChambers
#   ATTIRE UNLOCKED: <id>               entries of save.unlockedOutfits (Base is the starting
#                                        outfit and never emits; trial outfits are outfitPro,
#                                        outfitFaith, outfitShoujo, outfitSweater, outfitClassy,
#                                        outfitKnight, outfitJam, outfitPast)
#   KEY ACQUIRED: type=major|small | n=<count>/<5|7>
#   HEALTH PIECE: n=<count>/16
#   TIME TRIAL COMPLETE: <map> | rank=bronze|silver|gold|done
#   BOSS DEFEATED: <map>                a sealed-arena encounter deactivated after a kill
#   ENDING REACHED: x1
#   PLAYER DIED: x1
#   LUDODEX LOGGER READY: hooked=<n> | missing=<events absent from your game version>
#
# Notes:
# - Upgrade ids are the pawn's obtained*? booleans, observed in game dumps. The game-side
#   names are confirmed by the wiki ("Internal Name" fields) and the Archipelago mod's item
#   table: attack=Dream Breaker, powerBoost=Indignation, airKick=Sun Greaves, slide=Slide,
#   SlideJump=Solar Wind, plunge=Sunsetter, chargeAttack=Strikebreak, wallRide=Cling Gem,
#   Light=Ascendant Light, projectile=Soul Cutter. guard/jump/sprint are polled but no
#   pickup grants them: no achievement watches those (they would never fire).
# - Zone ids are the map package names, taken from the pak's file index and mapped to area
#   names by the Archipelago mod: ZONE_Dungeon=Dilapidated Dungeon, ZONE_LowerCastle=Castle
#   Sansa, Zone_Upper=Sansa Keep, ZONE_Exterior=Empty Bailey, Zone_Caves=The Underbelly,
#   Zone_Library=Listless Library, Zone_Theatre=Twilight Theatre, Zone_Tower=Tower Remains,
#   Zone_PrincessChambers=the Princess's chambers (endgame).
# - Only the first observed value emits a line (transitions only): a trial's rank is the
#   rank of its first completion, and improving it later stays silent — the silver/gold
#   milestones unlock only if some trial was first completed at that rank.
# - Provisional families (line format implemented and unit-tested, never seen in a real
#   session yet — the first real playthrough will confirm them): trials, outfits, health
#   pieces, Solar Wind (slidejump probe), the Princess fight and the ending.
# - Aspects and Mementos were dropped (re-scope): no readable collection source exists in
#   the game's data, so no achievement is built on them.
# - count: N counts matching lines. Only "PLAYER DIED" uses it (tracker contract).
# - hidden: true marks achievements whose name or description reveals a secret or an ending.

