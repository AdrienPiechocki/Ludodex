id: io.github.AdrienPiechocki.Ludodex
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: ludodex
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=host
  # Un sandbox masque ses propres états Flatpak (/var/lib/flatpak, ~/.local/share/flatpak
  # vidés) et les données des AUTRES apps (~/.var/app/<id>) : sans ces accès, les imports
  # Flatpak et RetroArch/Lutris/itch/Heroic (flatpak) voient le vide et n'importent rien.
  - --filesystem=/var/lib/flatpak:ro
  - --filesystem=~/.local/share/flatpak:ro
  - --filesystem=~/.var/app/org.libretro.RetroArch/config/retroarch:ro
  - --filesystem=~/.var/app/net.lutris.Lutris/data/lutris:ro
  - --filesystem=~/.var/app/io.itch.itch/config/itch/db:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config/heroic:ro
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: pyyaml
    buildsystem: simple
    build-options:
      build-args: [--share=network]
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app --break-system-packages "PyYAML>=5.4"
  - name: ludodex
    buildsystem: simple
    build-commands:
      - install -d /app/share/ludodex
      - cp -a . /app/share/ludodex/
      - install -Dm755 flatpak/ludodex /app/bin/ludodex
      - install -Dm755 flatpak/ludodex-cli /app/bin/ludodex-cli
      - install -Dm644 flatpak/io.github.AdrienPiechocki.Ludodex.desktop
        /app/share/applications/io.github.AdrienPiechocki.Ludodex.desktop
      - install -Dm644 flatpak/io.github.AdrienPiechocki.Ludodex.metainfo.xml
        /app/share/metainfo/io.github.AdrienPiechocki.Ludodex.metainfo.xml
      - install -d /app/share/icons/hicolor
      - cp -a share/icons/hicolor/. /app/share/icons/hicolor/
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - .build-cache
          - .pytest_cache
          - build
          - __pycache__
